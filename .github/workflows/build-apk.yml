name: Bab UL Ilm - Ready APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app with Supabase
        env:
          VITE_SUPABASE_URL: https://lqccpcdswarxatpvpayj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RmKBFxVKmrtS_r4-NGWCqw_TCqm_VAx
        run: npm run build --workspace apps/web

      - name: Create Android project when needed
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: bab-ul-ilm-ready-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
